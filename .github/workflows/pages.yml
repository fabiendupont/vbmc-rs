name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  K8S_OPENAPI_ENABLED_VERSION: "1.32"

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache DMTF validator and schemas
        uses: actions/cache@v6
        with:
          path: |
            .venv-dmtf
            SchemaFiles
          key: dmtf-validator-${{ runner.os }}

      - name: Run DMTF Redfish Service Validator
        run: bash scripts/dmtf-validate.sh --no-build

      - name: Install mdBook
        run: |
          MDBOOK_VERSION=0.4.44
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Prepare docs
        run: cp ARCHITECTURE.md docs/architecture.md

      - name: Build documentation
        run: mdbook build docs/

      - name: Copy DMTF report into book
        run: |
          REPORT=$(find dmtf-reports -name 'ConformanceHtmlLog_*.html' -type f 2>/dev/null | sort -r | head -1)
          if [ -n "$REPORT" ]; then
            cp "$REPORT" book/dmtf-report.html
          else
            echo '<html><body><p>DMTF report not available.</p></body></html>' > book/dmtf-report.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
