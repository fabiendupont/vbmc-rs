name: Publish to crates.io

# Publishing to crates.io is immutable: a version can never be re-uploaded or
# deleted, only yanked. This workflow therefore runs only when a GitHub release
# is explicitly published — creating the release is the manual approval gate.

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish vbmc-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag matches Cargo.toml version
        run: |
          VERSION="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi

      - name: Dry-run publish (verifies package)
        run: cargo publish --dry-run

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
