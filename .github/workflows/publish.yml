name: Publish to crates.io

# Publishing to crates.io is immutable: a version can never be re-uploaded or
# deleted, only yanked. This workflow therefore runs only after the Release
# workflow — itself triggered by an explicit version tag push — completes
# successfully.
#
# NOTE: this cannot use `on: release` because the release is created by
# release.yml with the default GITHUB_TOKEN, and events generated with
# GITHUB_TOKEN do not trigger other workflows (GitHub's recursion prevention).

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish vbmc-rs
    # Only publish when the Release workflow succeeded and was triggered by a
    # version tag (workflow_run head_branch is the tag name for tag pushes)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        run: |
          VERSION="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          TAG="${{ github.event.workflow_run.head_branch }}"
          if [ "${TAG}" != "${VERSION}" ]; then
            echo "::error::Release tag ${TAG} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi

      - name: Dry-run publish (verifies package)
        run: cargo publish --dry-run

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
