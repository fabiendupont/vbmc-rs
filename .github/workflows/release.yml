name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: default
            features: cloud-hypervisor,qemu
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - variant: default
            features: cloud-hypervisor,qemu
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - variant: kubevirt
            features: cloud-hypervisor,qemu,kubevirt,aggregator
            target: x86_64-unknown-linux-gnu
            suffix: "-kubevirt"
          - variant: kubevirt
            features: cloud-hypervisor,qemu,kubevirt,aggregator
            target: aarch64-unknown-linux-gnu
            suffix: "-kubevirt"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          K8S_OPENAPI_ENABLED_VERSION: "1.32"
        run: |
          cargo build --release --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/vbmc-rs dist/vbmc-rs
          if [ -f target/${{ matrix.target }}/release/vbmc-rs-aggregator ]; then
            cp target/${{ matrix.target }}/release/vbmc-rs-aggregator dist/vbmc-rs-aggregator
          fi
          cd dist
          tar czf ../vbmc-rs${{ matrix.suffix }}-${{ matrix.target }}.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: vbmc-rs${{ matrix.suffix }}-${{ matrix.target }}
          path: "*.tar.gz"

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.tar.gz
