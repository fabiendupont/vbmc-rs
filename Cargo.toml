[package]
name = "vbmc-rs"
version = "0.1.0"
edition = "2024"
description = "A Redfish-compliant virtual BMC — manage VMs with the same Redfish API used for physical servers"
license = "Apache-2.0"
repository = "https://github.com/fabiendupont/vbmc-rs"
homepage = "https://github.com/fabiendupont/vbmc-rs"
readme = "README.md"
keywords = ["redfish", "bmc", "ipmi", "virtualization", "server-management"]
categories = ["virtualization", "simulation", "web-programming::http-server"]

[lib]
name = "vbmc_rs"
path = "src/lib.rs"

[[bin]]
name = "vbmc-rs"
path = "src/main.rs"

[[bin]]
name = "vbmc-rs-aggregator"
path = "src/aggregator/main.rs"
required-features = ["aggregator"]

[[bin]]
name = "vbmc-rs-webhook"
path = "src/webhook/main.rs"
required-features = ["webhook"]

[features]
default = ["cloud-hypervisor"]
cloud-hypervisor = []
qemu = []
libvirt = ["dep:quick-xml", "dep:virt"]
kubevirt = ["dep:kube", "dep:k8s-openapi", "dep:schemars", "dep:http"]
aggregator = ["dep:kube", "dep:k8s-openapi", "dep:http"]
webhook = []
keylime = []
trustee = []
nvidia-cc = []
test-support = []

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rand = "0.9"
base64 = "0.23"
argon2 = "0.6"
rcgen = "0.14"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
rustls = "0.23"
rustls-pemfile = "2"
dashmap = "6"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
anyhow = "1"
tokio-rustls = "0.26"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
quick-xml = { version = "0.42", optional = true }
virt = { version = "0.4", optional = true }
kube = { version = "4.2.0", features = ["client", "runtime", "derive"], optional = true }
k8s-openapi = { version = "0.28.0", optional = true }
schemars = { version = "1", features = ["derive"], optional = true }
http = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
vbmc-rs = { path = ".", features = ["test-support"] }
