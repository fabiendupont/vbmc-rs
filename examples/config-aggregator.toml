[server]
bind_address = "0.0.0.0"
port = 8443

[auth]
enabled = false

# auth_mode = "kubernetes"  # Use Kubernetes TokenReview/SubjectAccessReview
# auth_mode = "local"       # Use local session/account stores (default)

[discovery]
mode = "static"

[[discovery.endpoints]]
system_id = "vm1"
url = "http://localhost:8001"

[[discovery.endpoints]]
system_id = "vm2"
url = "http://localhost:8002"

[sidecar]
port = 8000
