codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 75%
        threshold: 5%
    patch:
      default:
        target: 75%
        threshold: 5%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no

ignore:
  - "src/integration_tests.rs"
  - "src/scenario_harness/"
  - "src/pldm_gen/"
  - "src/main.rs"
  - "src/aggregator/main.rs"
  - "src/webhook/main.rs"
  - "tests/"
  - "scripts/"
  - "charts/"
  - "book/"
  - "**/*.md"
